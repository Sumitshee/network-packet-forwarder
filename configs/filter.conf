# configs/filter.conf -- a packet filter for the router in configs/router.conf, which uses it once
# its "filter filter.conf" line is uncommented. The format is described in
# include/npf/core/config.hpp.
#
# Rules are tried in order, and the first that matches decides; a packet that no rule matches gets
# the policy. A rule with a port never matches a non-initial fragment, which carries no TCP or UDP
# header: see "Known limitations" in the README.
policy allow
deny  udp  any           -> 10.0.2.10 port 53
allow tcp  10.0.1.0/24   -> 10.0.2.0/24
deny  icmp 10.0.3.0/24   -> any
allow any  any           -> any in-port 0
