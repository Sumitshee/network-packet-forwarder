# configs/bridge.conf -- the router as a three-port switch, in the topology that
# scripts/setup_bridge_netns.sh builds: ns-h1, ns-h2 and ns-h3 share one IP subnet, 10.0.9.0/24,
# and each reaches ns-router through a veth. The format is described at the top of
# include/npf/core/config.hpp.
#
# The ports are bridged, all in bridge domain 1, and have no address: the router switches between
# the hosts and takes no part in their subnet.
interface veth-h1 port 0 mode bridged bridge-domain 1
interface veth-h2 port 1 mode bridged bridge-domain 1
interface veth-h3 port 2 mode bridged bridge-domain 1

mac_age 300       # seconds a station is remembered after it last sent: a real switch's default

pool_size 4096
burst 32
io af_packet
fib linear
